<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security+ Cap. 1 · Q1–18</title>
<style>
:root{
  --bg:#f6f7f9;--card:#ffffff;--text:#1b1f24;--muted:#5f6b7a;--border:#e2e6eb;
  --accent:#2563eb;--ok:#15803d;--ok-bg:#e8f6ed;--bad:#b91c1c;--bad-bg:#fdecec;--chip:#eef2f7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216;--card:#171b21;--text:#e7ebf0;--muted:#9aa6b4;--border:#2a313a;
    --accent:#60a5fa;--ok:#4ade80;--ok-bg:#12291b;--bad:#f87171;--bad-bg:#2e1515;--chip:#212833;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216;--card:#171b21;--text:#e7ebf0;--muted:#9aa6b4;--border:#2a313a;
  --accent:#60a5fa;--ok:#4ade80;--ok-bg:#12291b;--bad:#f87171;--bad-bg:#2e1515;--chip:#212833;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header h1{font-size:1.35rem;margin:0 0 4px}
header p{margin:0;color:var(--muted);font-size:.92rem}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;margin-bottom:8px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.score{font-weight:600}
.bar button{margin-left:auto}
button{font:inherit;cursor:pointer;border:1px solid var(--border);background:var(--card);
  color:var(--text);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:16px;margin:14px 0}
.qhead{display:flex;gap:10px;align-items:baseline}
.num{flex:none;background:var(--chip);border-radius:6px;padding:1px 8px;font-weight:700;font-size:.85rem}
.q{font-weight:600;margin:0}
.opts{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.opt{width:100%;text-align:left;display:flex;gap:10px;padding:10px 12px}
.opt b{flex:none;width:1.2em}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.exp{display:none;margin-top:12px;padding:12px;border-left:3px solid var(--accent);
  background:var(--chip);border-radius:0 8px 8px 0;font-size:.95rem}
.exp.show{display:block}
.exp ul{margin:6px 0 0;padding-left:20px}
.ans{font-weight:700;color:var(--ok)}
.key{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin-top:10px}
.key span{background:var(--chip);border-radius:6px;padding:6px;text-align:center;font-weight:600}
.blur .key span{filter:blur(5px)}
h2{font-size:1.1rem;margin:28px 0 4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Security+ SY0-701 · Domínio 1.0</h1>
    <p>Conceitos gerais de segurança — questões 1 a 18, com explicações em português.</p>
  </header>

  <div class="bar">
    <span class="score" id="score">Acertos: 0 / 0</span>
    <button id="revealAll">Mostrar todas</button>
    <button id="reset">Recomeçar</button>
  </div>

  <div id="list"></div>

  <h2>Gabarito</h2>
  <div class="blur" id="keyWrap">
    <div class="key" id="key"></div>
    <p><button id="showKey">Revelar gabarito</button></p>
  </div>
</div>

<script>
const Q = [
 {q:"Criptografia que proteja arquivos copiados entre compartilhamentos e em repouso, com controle granular por usuário. Qual solução?",
  o:["Partition encryption","File encryption","Full-disk encryption","Record-level encryption"],a:1,
  e:"A criptografia fica no próprio arquivo, então o protege em repouso e quando ele é copiado, além de permitir chaves e permissões por usuário. A criptografia de partição e a de disco inteiro só protegem os dados enquanto estão naquele disco. A criptografia por registro é usada em bancos de dados."},
 {q:"Certificado para vários subdomínios (sales.example.com e support.example.com). Qual tipo?",
  o:["Self-signed","Root of trust","CRL certificate","Wildcard"],a:3,
  e:"Um certificado <code>*.example.com</code> cobre qualquer subdomínio de primeiro nível. Um certificado autoassinado não é confiável publicamente, e root of trust e CRL (lista de revogação) não servem para essa finalidade."},
 {q:"O que é analisado numa gap analysis (análise de lacunas)?",
  o:["Objetivos de controle e os controles que deveriam atendê-los","Redes fisicamente separadas e seus pontos de conexão","Controles compensatórios e os controles que substituem","Procedimentos e as políticas que apoiam"],a:0,
  e:"A análise compara o estado atual com o estado desejado. Ela verifica se os controles existentes atendem aos objetivos definidos, por exemplo de um framework como ISO 27001 ou NIST, e aponta as lacunas."},
 {q:"Restart de uma aplicação de produção voltada ao cliente para aplicar um patch urgente. Qual a preocupação técnica mais comum?",
  o:["Mudanças de configuração causadas pelo restart","Se o patch vai ser aplicado corretamente","Falta de controles de segurança durante o restart","O downtime durante o restart"],a:3,
  e:"Em uma aplicação crítica em produção, o impacto mais comum de um restart é a indisponibilidade do serviço. Por isso ele costuma exigir janela de manutenção e comunicação aos clientes."},
 {q:"Ferramentas como o git estão associadas a qual processo de gestão de mudanças?",
  o:["Backout plan","Stakeholder analysis","Version control","SOPs"],a:2,
  e:"O git rastreia alterações, quem as fez e quando. Ele até ajuda num rollback, mas sua função principal é o controle de versão."},
 {q:"Tornar uma senha fraca mais difícil de quebrar por força bruta, deixando cada tentativa mais lenta. Como se chama a técnica?",
  o:["Master keying","Key stretching","Key rotation","Passphrase armoring"],a:1,
  e:"Técnicas como PBKDF2, bcrypt e scrypt aplicam muitas iterações de hash, o que torna cada tentativa cara e desacelera a força bruta. Key rotation é a troca periódica de chaves e não resolve esse problema."},
 {q:"Monitoramento de logs é exemplo de qual categoria de controle?",
  o:["Technical","Managerial","Operational","Physical"],a:0,
  e:"É um controle aplicado por sistemas e tecnologia, como SIEM, syslog e IDS. As outras categorias:<ul><li><b>Gerenciais:</b> políticas e avaliação de risco.</li><li><b>Operacionais:</b> executados por pessoas, como guardas e treinamento.</li><li><b>Físicos:</b> cercas e fechaduras.</li></ul>"},
 {q:"Qual NÃO é uma técnica comum para dificultar a quebra offline de senhas?",
  o:["Salt","Pepper","Algoritmo de hash próprio para senhas","Criptografar a senha em texto puro com criptografia simétrica"],a:3,
  e:"Senhas devem passar por hash, não por criptografia. A criptografia é reversível: se a chave vazar, todas as senhas ficam expostas. As técnicas corretas:<ul><li><b>Salt:</b> valor aleatório por senha, que inutiliza as rainbow tables.</li><li><b>Pepper:</b> segredo global guardado fora do banco.</li><li><b>Algoritmos próprios:</b> bcrypt, scrypt, Argon2 e PBKDF2.</li></ul>"},
 {q:"Diffie-Hellman e RSA são exemplos de quê?",
  o:["Rekeying","Certificate revocation protocols","Key exchange algorithms","Key generation algorithms"],a:2,
  e:"Os dois permitem estabelecer ou trocar chaves com segurança num canal inseguro. O DH é usado, por exemplo, no TLS e no IKE do IPsec."},
 {q:"O que criar para o caso de uma mudança falhar?",
  o:["Impact analysis","Backout plan","Regression test","Maintenance window"],a:1,
  e:"É o procedimento para desfazer a mudança e voltar ao estado anterior. As outras opções não servem para isso:<ul><li><b>Análise de impacto:</b> é feita antes da mudança.</li><li><b>Teste de regressão:</b> valida a mudança, mas não a reverte.</li><li><b>Janela de manutenção:</b> é apenas o horário em que a mudança acontece.</li></ul>"},
 {q:"A janela de manutenção pode se estender além do previsto. Qual elemento da tríade CIA preocupa?",
  o:["Criticality","Accessibility","Integrity","Availability"],a:3,
  e:"Se a manutenção passa do tempo, o serviço fica fora do ar por mais tempo. Criticidade e acessibilidade não fazem parte da tríade CIA."},
 {q:"Proteger um gerador perto do estacionamento contra impactos de veículos, acidentais ou intencionais. O que instalar?",
  o:["Speed bump","Access control vestibule","Bollards","Chain-link fence"],a:2,
  e:"Bollards (balizadores) são postes reforçados que impedem fisicamente a passagem de veículos. As outras opções não resolvem:<ul><li><b>Lombada:</b> só reduz a velocidade.</li><li><b>Vestíbulo de controle de acesso:</b> é um controle para pessoas.</li><li><b>Alambrado:</b> não segura um carro.</li></ul>"},
 {q:"Uma ferramenta de DLP sinaliza dados para revisão antes de os e-mails saírem da organização. Que tipo de controle é esse?",
  o:["Managerial","Detective","Corrective","Preventive"],a:3,
  e:"O controle atua antes do vazamento acontecer, segurando o envio até a revisão. Se ele só alertasse depois do envio, seria detectivo."},
 {q:"Que tipo de controle é uma política ou procedimento?",
  o:["Directive","Corrective","Detective","Preventive"],a:0,
  e:"Políticas e procedimentos orientam o comportamento, dizendo o que deve ou não ser feito."},
 {q:"Uma ferramenta de monitoramento de integridade de arquivos (FIM) alerta quando arquivos são modificados. Que tipo de controle é esse?",
  o:["Preventive","Deterrent","Directive","Detective"],a:3,
  e:"Ela não impede a alteração, apenas detecta e alerta depois que ela ocorre."},
 {q:"Qual controle melhor reduz o impacto de credenciais comprometidas?",
  o:["Single sign-on","Federation","Zero trust","MFA"],a:3,
  e:"Mesmo com usuário e senha vazados, o atacante ainda precisa do segundo fator. SSO e federação podem até ampliar o alcance de uma credencial roubada. Zero trust é uma arquitetura mais ampla, não o controle mais direto para esse caso."},
 {q:"Ofuscar dados no banco, podendo referenciá-los sem expor o dado real. Qual opção?",
  o:["Tokenization","Encryption","Data masking","Data randomization"],a:0,
  e:"O dado real é trocado por um token sem valor, e o mapeamento fica num cofre separado. Assim o sistema referencia o dado sem expô-lo. É muito usada para números de cartão (PCI DSS). Já o mascaramento oculta o dado de forma definitiva."},
 {q:"Na criptografia de chave pública, qual chave decifra a mensagem recebida?",
  o:["Chave privada do destinatário","Chave pública do destinatário","Chave privada do remetente","Chave pública do remetente"],a:0,
  e:"O remetente cifra com a chave pública do destinatário, e só a chave privada dele decifra. Na assinatura digital é o inverso: assina-se com a chave privada do remetente e verifica-se com a chave pública dele."}
];

const L = "ABCD";
const list = document.getElementById("list");
let answered = 0, correct = 0;

function render(){
  list.innerHTML = "";
  answered = 0; correct = 0; updateScore();
  Q.forEach((it,i)=>{
    const c = document.createElement("div");
    c.className = "card";
    c.innerHTML = `<div class="qhead"><span class="num">${i+1}</span><p class="q">${it.q}</p></div>
      <ul class="opts">${it.o.map((t,j)=>`<li><button class="opt" data-j="${j}"><b>${L[j]}</b><span>${t}</span></button></li>`).join("")}</ul>
      <div class="exp"><span class="ans">Resposta: ${L[it.a]} – ${it.o[it.a]}</span><br>${it.e}</div>`;
    c.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>pick(c,it,+b.dataset.j)));
    list.appendChild(c);
  });
}

function pick(c,it,j,silent){
  if(c.dataset.done) return;
  c.dataset.done = 1;
  const btns = c.querySelectorAll(".opt");
  btns.forEach(b=>b.disabled = true);
  btns[it.a].classList.add("ok");
  if(!silent){
    answered++;
    if(j===it.a) correct++; else btns[j].classList.add("bad");
    updateScore();
  }
  c.querySelector(".exp").classList.add("show");
}

function updateScore(){
  document.getElementById("score").textContent = `Acertos: ${correct} / ${answered}`;
}

document.getElementById("revealAll").onclick = ()=>{
  document.querySelectorAll(".card").forEach((c,i)=>pick(c,Q[i],-1,true));
};
document.getElementById("reset").onclick = ()=>{
  render();
  document.getElementById("keyWrap").classList.add("blur");
  window.scrollTo(0,0);
};
document.getElementById("key").innerHTML = Q.map((it,i)=>`<span>${i+1}-${L[it.a]}</span>`).join("");
document.getElementById("showKey").onclick = ()=>document.getElementById("keyWrap").classList.remove("blur");

render();
</script>
</body>
</html>
